# Shared by every ESPHome device in the house.
# The room file sets three substitutions:
#   host       hostname, e.g. occ-living-room or ac-living-room
#   room_name  Home Assistant device name, e.g. "Living room"
#   role       prefix for diagnostic entities, e.g. "Presence node" or "AC bridge"

esphome:
  name: ${host}
  friendly_name: ${room_name}

logger:
  baud_rate: 0 # the UART belongs to the radar or the mini-split, not the log

api:
  encryption:
    key: !secret api_key

ota:
  - platform: esphome
    encryption: # bare block: reuses the API encryption key above

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap: # fallback hotspot when the home network is unreachable
    ssid: "${host} setup"
    password: !secret fallback_password

captive_portal:

sensor:
  - platform: wifi_signal
    name: "${role} Wi-Fi signal"
    update_interval: 60s
    entity_category: diagnostic
  - platform: uptime
    name: "${role} uptime"
    entity_category: diagnostic

button:
  - platform: restart
    name: "${role} restart"
    entity_category: config
