  - light:
      - name: Living room ceiling
        unique_id: fake_living_room_ceiling
        state: "{{ is_state('input_boolean.fake_living_room_light', 'on') }}"
        level: "{{ states('input_number.fake_living_room_brightness') | int(255) }}"
        temperature: "{{ (1000000 / (states('input_number.fake_living_room_kelvin') | int(2250))) | round | int }}"
        # Like Home Assistant's WLED integration: 2000 K is the strip's warm end, 6535 K its cool end.
        min_mireds: 153
        max_mireds: 500
        turn_on:
          - action: input_boolean.turn_on
            target:
              entity_id: input_boolean.fake_living_room_light
        turn_off:
          - action: input_boolean.turn_off
            target:
              entity_id: input_boolean.fake_living_room_light
        set_level:
          - action: input_number.set_value
            target:
              entity_id: input_number.fake_living_room_brightness
            data:
              value: "{{ [brightness | int, 1] | max }}"
          - action: input_boolean.turn_on
            target:
              entity_id: input_boolean.fake_living_room_light
        set_temperature:
          - action: input_number.set_value
            target:
              entity_id: input_number.fake_living_room_kelvin
            data:
              value: "{{ [[(1000000 / color_temp) | round | int, 2000] | max, 6535] | min }}"
          - if: "{{ brightness is defined and brightness is not none }}"
            then:
              - action: input_number.set_value
