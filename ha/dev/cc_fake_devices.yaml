      - name: Living room presence
        unique_id: fake_living_room_presence
        device_class: occupancy
        state: "{{ is_state('input_boolean.fake_living_room_presence', 'on') }}"
      - name: Kitchen presence
        unique_id: fake_kitchen_presence
        device_class: occupancy
        state: "{{ is_state('input_boolean.fake_kitchen_presence', 'on') }}"
      - name: Bedroom presence
        unique_id: fake_bedroom_presence
        device_class: occupancy
        state: "{{ is_state('input_boolean.fake_bedroom_presence', 'on') }}"
      - name: Office presence
        unique_id: fake_office_presence
        device_class: occupancy
        state: "{{ is_state('input_boolean.fake_office_presence', 'on') }}"
  - sensor:
      - name: Living room temperature
        unique_id: fake_living_room_temperature
        unit_of_measurement: "°F"
        device_class: temperature
        state: "{{ states('input_number.fake_living_room_temp') | float(69) }}"
      - name: Living room humidity
        unique_id: fake_living_room_humidity
        unit_of_measurement: "%"
        device_class: humidity
        state: "41"
      - name: Living room intake
        unique_id: fake_living_room_intake
