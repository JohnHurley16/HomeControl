climate:
  - platform: generic_thermostat
    name: Living room
    unique_id: fake_living_room_climate
    heater: input_boolean.fake_living_room_heater
    target_sensor: sensor.living_room_intake
    min_temp: 60
    max_temp: 86
    cold_tolerance: 0.5
    hot_tolerance: 0.5
    initial_hvac_mode: heat
    precision: 0.5
    target_temp_step: 0.5
  - platform: generic_thermostat
    name: Kitchen
    unique_id: fake_kitchen_climate
    heater: input_boolean.fake_kitchen_heater
    target_sensor: sensor.kitchen_intake
    min_temp: 60
    max_temp: 86
