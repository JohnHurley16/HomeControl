# Generated by tools/generate.mjs from rooms.json. Edit the generator, not this file.
# Room: Bedroom (bedroom)
# Expects these entities from the devices in the room:
#   light.bedroom_ceiling, climate.bedroom, sensor.bedroom_temperature,
#   sensor.bedroom_humidity, binary_sensor.bedroom_presence
# The second radar adds sensor.bedroom_target_1_x, _target_1_y (and 2, 3) for the room map.

input_number:
  bedroom_offset:
    name: Bedroom offset
    min: -5
    max: 5
    step: 1
    unit_of_measurement: "°F"
    icon: mdi:thermometer-plus
  bedroom_empty_adjust:
    name: Bedroom empty-room adjustment
    min: -3
    max: 3
    step: 1
    unit_of_measurement: "°F"
    icon: mdi:account-off
  bedroom_sensor_correction:
    name: Bedroom room-sensor correction
    min: -4
    max: 4
    step: 0.5
    unit_of_measurement: "°F"
    icon: mdi:thermometer-lines
  bedroom_lights_off_after:
    name: Bedroom lights off after
    min: 1
    max: 120
    step: 1
    unit_of_measurement: min
    icon: mdi:timer-outline
  # Room map: the room as seen from above, with the radar's wall along the top. 0 means not set.
  bedroom_map_width:
    name: Bedroom map, width along the radar's wall
    min: 0
    max: 40
    step: 0.5
    unit_of_measurement: ft
    icon: mdi:arrow-expand-horizontal
  bedroom_map_depth:
    name: Bedroom map, depth out from the radar's wall
    min: 0
    max: 40
    step: 0.5
    unit_of_measurement: ft
    icon: mdi:arrow-expand-vertical
  bedroom_map_radar_x:
    name: Bedroom map, radar from the left wall
    min: 0
    max: 40
    step: 0.5
    unit_of_measurement: ft
    icon: mdi:radar

input_boolean:
  bedroom_lights_auto_off:
    name: Bedroom lights off when empty
    icon: mdi:lightbulb-off-outline
  bedroom_lights_walk_in:
    name: Bedroom walk-in light
    icon: mdi:lightbulb-auto-outline
  bedroom_map_mirror:
    name: Bedroom map, swap left and right
    icon: mdi:flip-horizontal

template:
  - binary_sensor:
      - name: Bedroom occupied
        unique_id: cc_bedroom_occupied
        device_class: occupancy
        state: "{{ is_state('binary_sensor.bedroom_presence', 'on') }}"
        availability: "{{ has_value('binary_sensor.bedroom_presence') }}"
        delay_on: "00:00:03"
        delay_off: "00:02:00"
  - sensor:
      # What the room is asked to be: shown in the front end.
      - name: Bedroom target
        unique_id: cc_bedroom_target
        unit_of_measurement: "°F"
        device_class: temperature
        state: >-
          {{ (states('sensor.cc_mode_target') | float(70)
              + states('input_number.bedroom_offset') | float(0)
              + states('input_number.bedroom_empty_adjust') | float(0)) | round(1) }}
      # What is sent to the unit: the target plus cc-core's room-sensor correction.
      - name: Bedroom setpoint
        unique_id: cc_bedroom_setpoint
        unit_of_measurement: "°F"
        device_class: temperature
        state: >-
          {% set t = states('sensor.bedroom_target') | float(70)
                     + states('input_number.bedroom_sensor_correction') | float(0) %}
          {{ [[t, 60] | max, 86] | min | round(1) }}

automation:
  - id: cc_bedroom_apply_setpoint
    alias: "CC thermostat: Bedroom setpoint"
    description: Basic thermostat rule. The only thing that writes this unit's temperature.
    mode: restart
    triggers:
      - trigger: state
        entity_id: sensor.bedroom_setpoint
      - trigger: state
        entity_id: climate.bedroom
        from: unavailable
      - trigger: homeassistant
        event: start
      - trigger: state
        entity_id: input_boolean.cc_initialized
        to: "on"
    conditions:
      # Never before the first-run defaults: untouched helpers sit at their minimums.
      - condition: state
        entity_id: input_boolean.cc_initialized
        state: "on"
      - condition: template
        value_template: "{{ has_value('sensor.bedroom_setpoint') and has_value('climate.bedroom') }}"
    actions:
      - action: climate.set_temperature
        target:
          entity_id: climate.bedroom
        data:
          temperature: "{{ states('sensor.bedroom_setpoint') | float }}"

  - id: cc_bedroom_lights_off_when_empty
    alias: "CC presence: Bedroom lights off when empty"
    mode: restart
    triggers:
      - trigger: state
        entity_id: binary_sensor.bedroom_occupied
        to: "off"
        for:
          minutes: "{{ states('input_number.bedroom_lights_off_after') | int(15) }}"
    conditions:
      - condition: state
        entity_id: input_boolean.bedroom_lights_auto_off
        state: "on"
      - condition: state
        entity_id: light.bedroom_ceiling
        state: "on"
    actions:
      - if:
          - condition: state
            entity_id: input_boolean.rule_presence_dry_run
            state: "on"
        then:
          - action: logbook.log
            data:
              name: CC presence
              message: "dry run: would turn off the Bedroom lights (room empty)"
              entity_id: light.bedroom_ceiling
          - stop: Dry run
      - action: scene.create
        data:
          scene_id: cc_bedroom_before_dim
          snapshot_entities:
            - light.bedroom_ceiling
      - action: light.turn_on
        target:
          entity_id: light.bedroom_ceiling
        data:
          brightness_pct: >-
            {{ [[20, ((state_attr('light.bedroom_ceiling', 'brightness') | int(255)) / 5.1) | int] | min, 1] | max }}
          transition: 2
      - wait_for_trigger:
          - trigger: state
            entity_id: binary_sensor.bedroom_presence
            to: "on"
        timeout: "00:00:30"
      - if:
          - condition: template
            value_template: "{{ wait.trigger is not none }}"
        then:
          - action: scene.turn_on
            target:
              entity_id: scene.cc_bedroom_before_dim
            data:
              transition: 1
        else:
          - action: light.turn_off
            target:
              entity_id: light.bedroom_ceiling
            data:
              transition: 2

  - id: cc_bedroom_ease_when_empty
    alias: "CC presence: Bedroom eases when empty"
    mode: restart
    triggers:
      - trigger: state
        entity_id: binary_sensor.bedroom_occupied
        to: "off"
        for: "00:45:00"
      - trigger: state
        entity_id: binary_sensor.bedroom_occupied
        to:
          - "on"
          - unavailable
      - trigger: state
        entity_id:
          - input_select.house_mode
          - input_select.house_season
          - input_boolean.rule_ease_empty
          - input_boolean.rule_presence_dry_run
    variables:
      empty_long_enough: >-
        {{ is_state('binary_sensor.bedroom_occupied', 'off')
           and (now() - states.binary_sensor.bedroom_occupied.last_changed).total_seconds() >= 2700 }}
      wanted: >-
        {{ empty_long_enough
           and is_state('input_select.house_mode', 'Home')
           and is_state('input_boolean.rule_ease_empty', 'on') }}
      amount: "{{ -2 if is_state('input_select.house_season', 'Heat') else 2 }}"
      dry_run: "{{ is_state('input_boolean.rule_presence_dry_run', 'on') }}"
    actions:
      - if:
          - condition: template
            value_template: "{{ wanted and dry_run and trigger.platform == 'state' and trigger.entity_id == 'binary_sensor.bedroom_occupied' }}"
        then:
          - action: logbook.log
            data:
              name: CC presence
              message: "dry run: would ease Bedroom by {{ amount }} degrees (room empty 45 min)"
              entity_id: climate.bedroom
      - action: input_number.set_value
        target:
          entity_id: input_number.bedroom_empty_adjust
        data:
          value: "{{ amount if (wanted and not dry_run) else 0 }}"

  - id: cc_bedroom_walk_in_light
    alias: "CC presence: Bedroom walk-in light"
    mode: single
    triggers:
      - trigger: state
        entity_id: binary_sensor.bedroom_occupied
        from: "off"
        to: "on"
    conditions:
      - condition: state
        entity_id: input_boolean.bedroom_lights_walk_in
        state: "on"
      - condition: state
        entity_id: light.bedroom_ceiling
        state: "off"
      - condition: state
        entity_id: sun.sun
        state: below_horizon
    actions:
      - if:
          - condition: state
            entity_id: input_boolean.rule_presence_dry_run
            state: "on"
        then:
          - action: logbook.log
            data:
              name: CC presence
              message: "dry run: would turn on the Bedroom lights (walked in)"
              entity_id: light.bedroom_ceiling
          - stop: Dry run
      - action: script.cc_light_preset
        data:
          room: bedroom
          preset: "{{ 'night' if is_state('input_select.house_mode', 'Sleep') else states('sensor.cc_time_of_day_preset') }}"
