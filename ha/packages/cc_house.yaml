# Generated by tools/generate.mjs from rooms.json. Edit the generator, not this file.
# House-level helpers, scripts and rules. Scenes live in cc_scenes.yaml, which is yours to edit.

input_select:
  house_mode:
    name: House mode
    options:
      - Home
      - Away
      - Sleep
      - Vacation
    icon: mdi:home-account
  house_season:
    name: House season
    options:
      - Heat
      - Cool
    icon: mdi:sun-snowflake-variant

input_number:
  target_home:
    name: Target, Home
    min: 55
    max: 85
    step: 1
    unit_of_measurement: "°F"
    mode: box
  target_sleep:
    name: Target, Sleep
    min: 55
    max: 85
    step: 1
    unit_of_measurement: "°F"
    mode: box
  target_away:
    name: Target, Away
    min: 55
    max: 85
    step: 1
    unit_of_measurement: "°F"
    mode: box
  target_vacation:
    name: Target, Vacation
    min: 45
    max: 90
    step: 1
    unit_of_measurement: "°F"
    mode: box

input_boolean:
  rule_one_mode:
    name: "Rule: one mode for all zones"
  rule_room_sensors:
    name: "Rule: control to room sensors"
  rule_preheat:
    name: "Rule: pre-heat before arrival"
  rule_small_setbacks:
    name: "Rule: small setbacks only"
  rule_window_pause:
    name: "Rule: pause a zone on open window"
  rule_ease_empty:
    name: "Rule: ease empty rooms"
  rule_auto_away:
    name: "Rule: auto Away"
  rule_presence_dry_run:
    name: "Presence rules: dry run"
  cc_initialized:
    name: CC defaults applied

template:
  - sensor:
      - name: CC mode target
        unique_id: cc_mode_target
        unit_of_measurement: "°F"
        device_class: temperature
        # Small setbacks: while that rule is on, Sleep and Away run within 3 degrees of Home.
        # The stored targets are never rewritten, so nothing is lost when Home moves for an evening.
        state: >-
          {% set mode = states('input_select.house_mode') %}
          {% set home = states('input_number.target_home') | float(70) %}
          {% set t = states('input_number.target_' ~ (mode | lower)) | float(home) %}
          {% if mode in ['Sleep', 'Away'] and is_state('input_boolean.rule_small_setbacks', 'on') %}
            {{ [[t, home - 3] | max, home + 3] | min }}
          {% else %}
            {{ t }}
          {% endif %}
        attributes:
          # What Sleep and Away run at right now; the front end shows it when it differs from the stored target.
          sleep: >-
            {% set home = states('input_number.target_home') | float(70) %}
            {% set t = states('input_number.target_sleep') | float(home) %}
            {{ ([[t, home - 3] | max, home + 3] | min) if is_state('input_boolean.rule_small_setbacks', 'on') else t }}
          away: >-
            {% set home = states('input_number.target_home') | float(70) %}
            {% set t = states('input_number.target_away') | float(home) %}
            {{ ([[t, home - 3] | max, home + 3] | min) if is_state('input_boolean.rule_small_setbacks', 'on') else t }}
      # Single source for light presets: the scripts below and the front end both read this.
      - name: CC light presets
        unique_id: cc_light_presets
        state: ok
        attributes:
          # Presets are in the strip's own Kelvin. A light entity may use another scale (WLED
          # reports 2000 to 6535 for any CCT strip), so the script and the front end convert.
          strip_kelvin: "{{ [2700, 6500] }}"
          order: "{{ ['bright', 'relax', 'night', 'movie'] }}"
          presets: >-
            {{ {
              'bright': {'name': 'Bright', 'brightness_pct': 100, 'kelvin': 4500},
              'relax': {'name': 'Relax', 'brightness_pct': 45, 'kelvin': 2900},
              'night': {'name': 'Night', 'brightness_pct': 5, 'kelvin': 2700},
              'movie': {'name': 'Movie', 'brightness_pct': 15, 'kelvin': 2700}
            } }}
      - name: CC time of day preset
        unique_id: cc_time_of_day_preset
        state: >-
          {% set h = now().hour %}
          {{ 'bright' if 6 <= h < 17 else ('relax' if 17 <= h < 22 else 'night') }}
  - binary_sensor:
      - name: House occupied
        unique_id: cc_house_occupied
        device_class: occupancy
        state: >-
          {{ ['binary_sensor.living_room_occupied', 'binary_sensor.kitchen_occupied', 'binary_sensor.bedroom_occupied', 'binary_sensor.office_occupied']
             | select('is_state', 'on') | list | count > 0 }}
      - name: CC house empty
        unique_id: cc_house_empty
        state: "{{ states('zone.home') | int(0) == 0 and is_state('binary_sensor.house_occupied', 'off') }}"

script:
  cc_light_preset:
    alias: "CC: apply a light preset"
    mode: parallel
    fields:
      room:
        description: Room slug, for example living_room
        required: true
        selector:
          text:
      preset:
        description: bright, relax, night or movie
        required: true
        selector:
          text:
    sequence:
      - variables:
          light: "light.{{ room }}_ceiling"
          p: "{{ state_attr('sensor.cc_light_presets', 'presets')[preset] }}"
          strip: "{{ state_attr('sensor.cc_light_presets', 'strip_kelvin') }}"
          # The light's own scale: its minimum is the strip's warm end, its maximum the cool end.
          lo: "{{ state_attr(light, 'min_color_temp_kelvin') | int(strip[0]) }}"
          hi: "{{ state_attr(light, 'max_color_temp_kelvin') | int(strip[1]) }}"
          kelvin: >-
            {% set f = (p.kelvin - strip[0]) / (strip[1] - strip[0]) %}
            {{ (lo + ([[f, 0] | max, 1] | min) * (hi - lo)) | round | int }}
      - action: light.turn_on
        target:
          entity_id: "{{ light }}"
        data:
          brightness_pct: "{{ p.brightness_pct }}"
          color_temp_kelvin: "{{ kelvin }}"
          transition: 1

  cc_lights_on:
    alias: "CC: lights on, or next preset"
    description: The wall remote's Lights on key. Off turns on at the time-of-day preset; on steps to the next preset.
    mode: queued
    fields:
      room:
        required: true
        selector:
          text:
    sequence:
      - variables:
          light: "light.{{ room }}_ceiling"
          presets: "{{ state_attr('sensor.cc_light_presets', 'presets') }}"
          order: "{{ state_attr('sensor.cc_light_presets', 'order') }}"
          current: >-
            {% set ns = namespace(best=order[0], diff=999) %}
            {% set b = (state_attr(light, 'brightness') | int(0)) / 2.55 %}
            {% for k in order %}
              {% set d = (presets[k].brightness_pct - b) | abs %}
              {% if d < ns.diff %}{% set ns.best = k %}{% set ns.diff = d %}{% endif %}
            {% endfor %}
            {{ ns.best }}
          wanted: >-
            {% if is_state(light, 'on') %}
              {{ order[(order.index(current) + 1) % (order | count)] }}
            {% else %}
              {{ states('sensor.cc_time_of_day_preset') }}
            {% endif %}
      - action: script.cc_light_preset
        data:
          room: "{{ room }}"
          preset: "{{ wanted | trim }}"

  cc_all_off:
    alias: "CC: all lights off"
    sequence:
      - action: light.turn_off
        target:
          entity_id:
            - light.living_room_ceiling
            - light.kitchen_ceiling
            - light.bedroom_ceiling
            - light.office_ceiling
        data:
          transition: 2

  cc_goodnight:
    alias: "CC: goodnight"
    sequence:
      - action: script.cc_all_off
      - action: input_select.select_option
        target:
          entity_id: input_select.house_mode
        data:
          option: Sleep

  cc_set_defaults:
    alias: "CC: set every helper to its default"
    description: Runs once on first start. Run it by hand to reset the house.
    sequence:
      - action: input_number.set_value
        target:
          entity_id: input_number.target_home
        data:
          value: 70
      - action: input_number.set_value
        target:
          entity_id: input_number.target_sleep
        data:
          value: 68
      - action: input_number.set_value
        target:
          entity_id: input_number.target_away
        data:
          value: 67
      - action: input_number.set_value
        target:
          entity_id: input_number.target_vacation
        data:
          value: 60
      - action: input_number.set_value
        target:
          entity_id:
            - input_number.living_room_offset
            - input_number.kitchen_offset
            - input_number.bedroom_offset
            - input_number.office_offset
            - input_number.living_room_empty_adjust
            - input_number.kitchen_empty_adjust
            - input_number.bedroom_empty_adjust
            - input_number.office_empty_adjust
            - input_number.living_room_sensor_correction
            - input_number.kitchen_sensor_correction
            - input_number.bedroom_sensor_correction
            - input_number.office_sensor_correction
        data:
          value: 0
      - action: input_number.set_value
        target:
          entity_id:
            - input_number.living_room_lights_off_after
            - input_number.kitchen_lights_off_after
            - input_number.bedroom_lights_off_after
            - input_number.office_lights_off_after
        data:
          value: 15
      - action: input_boolean.turn_on
        target:
          entity_id:
            - input_boolean.rule_one_mode
            - input_boolean.rule_room_sensors
            - input_boolean.rule_preheat
            - input_boolean.rule_small_setbacks
            - input_boolean.rule_ease_empty
            - input_boolean.rule_auto_away
            - input_boolean.rule_presence_dry_run
            - input_boolean.living_room_lights_auto_off
            - input_boolean.kitchen_lights_auto_off
            - input_boolean.bedroom_lights_auto_off
            - input_boolean.office_lights_auto_off
      - action: input_boolean.turn_off
        target:
          entity_id:
            - input_boolean.rule_window_pause
            - input_boolean.living_room_lights_walk_in
            - input_boolean.kitchen_lights_walk_in
            - input_boolean.bedroom_lights_walk_in
            - input_boolean.office_lights_walk_in
      - action: input_select.select_option
        target:
          entity_id: input_select.house_mode
        data:
          option: Home

automation:
  - id: cc_first_run_defaults
    alias: "CC: first-run defaults"
    triggers:
      - trigger: homeassistant
        event: start
    conditions:
      - condition: state
        entity_id: input_boolean.cc_initialized
        state: "off"
    actions:
      - action: script.cc_set_defaults
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.cc_initialized

  - id: cc_season_lock
    alias: "CC thermostat: season lock"
    description: Every unit heats or cools together. Mandatory when the heads share one outdoor unit.
    mode: queued
    triggers:
      - trigger: state
        entity_id:
          - input_select.house_season
          - input_boolean.rule_one_mode
      - trigger: homeassistant
        event: start
      - trigger: state
        entity_id:
          - climate.living_room
          - climate.kitchen
          - climate.bedroom
          - climate.office
        from: unavailable
      - trigger: state
        entity_id:
          - climate.living_room
          - climate.kitchen
          - climate.bedroom
          - climate.office
        to:
          - heat
          - cool
          - heat_cool
          - auto
    conditions:
      - condition: state
        entity_id: input_boolean.rule_one_mode
        state: "on"
    variables:
      wanted: "{{ 'heat' if is_state('input_select.house_season', 'Heat') else 'cool' }}"
      units: >-
        {{ ['climate.living_room', 'climate.kitchen', 'climate.bedroom', 'climate.office']
           | select('has_value') | reject('is_state', 'off') | reject('is_state', wanted) | list }}
    actions:
      - condition: template
        value_template: "{{ units | count > 0 }}"
      - action: climate.set_hvac_mode
        target:
          entity_id: "{{ units }}"
        data:
          hvac_mode: "{{ wanted }}"

  - id: cc_auto_away
    alias: "CC presence: auto Away and back"
    mode: queued
    triggers:
      - trigger: state
        entity_id: binary_sensor.cc_house_empty
        to: "on"
        for: "00:20:00"
        id: empty
      # Check again 20 minutes after the mode returns to Home or Sleep with nobody there
      # (pre-heat fired for a drive-by, or someone tapped Home from work), and when the
      # rule or dry run is switched while the house is already empty.
      - trigger: state
        entity_id: input_select.house_mode
        to:
          - Home
          - Sleep
        for: "00:20:00"
        id: empty
      - trigger: state
        entity_id: input_boolean.rule_auto_away
        to: "on"
        id: empty
      - trigger: state
        entity_id: input_boolean.rule_presence_dry_run
        to: "off"
        id: empty
      - trigger: numeric_state
        entity_id: zone.home
        above: 0
        id: arrived
    conditions:
      - condition: state
        entity_id: input_boolean.rule_auto_away
        state: "on"
    actions:
      - choose:
          - conditions:
              - condition: trigger
                id: empty
              - condition: state
                entity_id: binary_sensor.cc_house_empty
                state: "on"
                for: "00:20:00"
              - condition: state
                entity_id: input_select.house_mode
                state:
                  - Home
                  - Sleep
            sequence:
              - if:
                  - condition: state
                    entity_id: input_boolean.rule_presence_dry_run
                    state: "on"
                then:
                  - action: logbook.log
                    data:
                      name: CC presence
                      message: "dry run: would switch the house to Away (nobody home for 20 min)"
                      entity_id: input_select.house_mode
                else:
                  - action: input_select.select_option
                    target:
                      entity_id: input_select.house_mode
                    data:
                      option: Away
          - conditions:
              - condition: trigger
                id: arrived
              - condition: state
                entity_id: input_select.house_mode
                state: Away
            sequence:
              - action: input_select.select_option
                target:
                  entity_id: input_select.house_mode
                data:
                  option: Home
